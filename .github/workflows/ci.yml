name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Testlerin Oracle XE imajı büyük (açılmış hali ~6 GB); ayrı adımda çekilir ki süresi derlemeden ayrı görünsün.
      # Docker Hub anonim çekişleri sınırladığı için imaj GitHub registry'sinden gelir (OracleDatabase.IMAGE).
      - name: Pull Oracle XE image
        run: docker pull -q ghcr.io/gvenzl/oracle-xe:21-slim-faststart

      - name: Build and test
        run: mvn -B -ntp verify

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          retention-days: 7
