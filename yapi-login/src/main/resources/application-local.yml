# Geliştiricinin makinesi: LDAP ve Koordinatör yerine sabit kullanıcılar (şifre = kullanıcı adı) ve sabit yetkiler.
# YAPI_REDIS_* ile DEV Redis'e bağlanır ama DEV'in ortak anahtarlarına yazmaz: oturumlar ve application listesi
# yalnızca yerel anahtarlarda. Yerel broker bu oturumları YAPI_SESSION_KEY_PREFIX=local: ile okur.
# DEV'in LDAP'ı ya da Koordinatör'ü denenecekse: YAPI_LOGIN_LDAP_MODE=bind + YAPI_LOGIN_LDAP_URLS, YAPI_KOORDINATOR_MODE=http +
# YAPI_KOORDINATOR_URL
login:
  ldap:
    mode: static
    users:
      dev.ali: dev.ali
      dev.ayse: dev.ayse
  session:
    key-pattern: "local:user:session:{uid}"
  applications:
    key: "yapi:applications:local"
  user-settings:
    keys:
      layout: "local:user:layout:{uid}"
      "[quick_link]": "local:user:quick_link:{uid}"
  koordinator-secret: local-koordinator-secret

koordinator:
  mode: ${YAPI_KOORDINATOR_MODE:static}
  static-permissions: [ORDER_READ, ORDER_WRITE, LOGPROJECT_TEMEL]
  static-projects: [web, mobil]
