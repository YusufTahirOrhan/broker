# Geliştiricinin makinesi: LDAP ve Koordinatör yerine sabit kullanıcılar (şifre = kullanıcı adı) ve sabit yetkiler;
# oturumlar BROKER_REDIS_* ile verilen Redis'e (DEV) yazılır. DEV'in LDAP'ı ya da Koordinatör'ü denenecekse:
# LOGIN_LDAP_MODE=bind + LOGIN_LDAP_URLS, KOORDINATOR_MODE=http + KOORDINATOR_URL
login:
  ldap:
    mode: static
    users:
      dev.ali: dev.ali
      dev.ayse: dev.ayse
  koordinator-secret: local-koordinator-secret

koordinator:
  mode: ${KOORDINATOR_MODE:static}
  static-permissions: [ORDER_READ, ORDER_WRITE, LOGPROJECT_TEMEL]
  static-projects: [web, mobil]
