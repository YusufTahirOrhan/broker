# Ortamların Admin API'lerine istemci sertifikasıyla (mTLS) bağlanır.
spring:
  ssl:
    bundle:
      jks:
        env-client:
          keystore:
            location: ${BROKER_ADMIN_CLIENT_KEYSTORE:file:/etc/broker/admin/client.p12}
            password: ${BROKER_ADMIN_CLIENT_KEYSTORE_PASSWORD:}
            type: PKCS12
          truststore:
            # ortam Admin API'lerinin sunucu sertifikaları (ya da CA'sı)
            location: ${BROKER_ADMIN_CLIENT_TRUSTSTORE:file:/etc/broker/admin/truststore.p12}
            password: ${BROKER_ADMIN_CLIENT_TRUSTSTORE_PASSWORD:}
            type: PKCS12

broker:
  admin:
    environments:
      ssl-bundle: env-client
